name : Doployment on Amazon ECS

on:
    push:
        branches:
            - "main"

env:
    AWS_REGION: "us-east-2"
    ECS_REPOSITORY: "document-rag"
    ECS_SERVICE: "document-rag-service"
    ECS_CLUSTER: "document-rag-cluster"
    ECS_TASK_DEFINITION: ".github/workflows/task-definition.json"
    CONTAINER_NAME: "document-rag-container"

permissions:
    contents: read
    id-token: write

jobs:
    deploy:
        name: Deploy
        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
        
            - name: Configure AWS credentials
            uses: aws-actions/configure-aws-credentials@v1
            with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}           
                aws-region: ${{ env.AWS_REGION }}
            
            - name: Deploy ECR stack (Optional)
            run: |
                aws cloudformation deploy --stack-name ecr-repo-stack --region ${{ env.AWS_REGION }} --template-file .github/workflows/template.yml --capabilities CAPABILITY_NAMED_IAM

            - name: Login to Amazon ECR
            id: login-ecr
            uses: aws-actions/amazon-ecr-login@v1
            
            - name: Build, tag, and push image to Amazon ECR
            id: build-image
            env:
                ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                IMAGE_TAG: latest
            run: |
                IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
                docker build -t $IMAGE_URI . 
                echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT
            
            - name: Fill in the new image ID in the Amazon ECS task definition
            id: task-def
            uses: aws-actions/amazon-ecs-render-task-definition@v1
            with:
                task-definition: ${{ env.ECS_TASK_DEFINITION }}
                container-name: ${{ env.CONTAINER_NAME }}
                image: ${{ steps.build-image.outputs.image }}
            
            - name: Deploy Amazon ECS task definition
            uses: aws-actions/amazon-ecs-deploy-task-definition@v1
            with:
                task-definition: ${{ steps.task-def.outputs.task-definition }}
                service: ${{ env.ECS_SERVICE }}
                cluster: ${{ env.ECS_CLUSTER }}
                wait-for-service-stability: true
            
            - name: Deployment Success Message
            run: |
                echo "Deployment completed successfully"